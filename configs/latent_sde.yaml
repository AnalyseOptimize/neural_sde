run_name: latent_sde_abm
seed: 0
device: auto

paths:
  log_root: ${hydra:runtime.cwd}/logs

data:
  dataset_size: 8192
  t_size: 128
  dt: 0.1
  normalize: false
  shuffle: true
  drop_last: true
  num_workers: 0

simulator:
  name: abm
  abm:
    dim: 2
    s0: 0.0
    mu: 0.1
    sigma: 0.2
    rho: 0.5
    corr: null
  gbm:
    dim: 1
    s0: 1.0
    mu: 0.05
    sigma: 0.2
    rho: 0.0
    corr: null
  ou:
    s0: 1.0
    theta: 0.1
    mu: 0.02
    sigma: 0.4
  deterministic:
    s0: 0.0
    mu: 0.1
  perturbations:
    gaussian:
      enabled: false
      variance: 0.0
      include_initial: true
      seed: null
    jumps:
      enabled: false
      intensity: 0.0
      size: 1.0
      seed: null

model:
  latent_size: 4
  context_size: 32
  hidden_size: 16

train:
  epochs: 150
  steps: null
  steps_per_epoch: null
  batch_size: 1024
  lr: 1.0e-2
  lr_gamma: 0.997
  weight_decay: 0.0
  kl_anneal_iters: 1000
  noise_std: 0.01
  adjoint: false
  method: euler
  dt: 1.0e-2
  sample_method: null
  sample_dt: 1.0e-3
  grad_clip_norm: null
  log_every: 10
  eval_every: 0
  save_checkpoint: true

evaluation:
  enabled: true
  every_epoch: 1
  n_paths: 512
  num_quantiles: 1024
  align_initial: true
  coupled_brownian: false

plots:
  enabled: true
  n_paths: 24
  align_initial: true

hydra:
  run:
    dir: ${paths.log_root}/hydra/${run_name}
