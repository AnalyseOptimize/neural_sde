run_name: latent_sde_ou
seed: 0
device: auto

paths:
  log_root: ${hydra:runtime.cwd}/logs

data:
  dataset_size: 2048
  t_size: 201
  dt: 0.05
  normalize: false
  shuffle: true
  drop_last: true
  num_workers: 0

simulator:
  name: ou
  abm:
    dim: 2
    s0: 0.0
    mu: 0.1
    sigma: 0.2
    rho: 0.5
    corr: null
  gbm:
    dim: 1
    s0: 1.0
    mu: 0.05
    sigma: 0.2
    rho: 0.0
    corr: null
  ou:
    s0: 2.0
    theta: 1.0
    mu: 0.0
    sigma: 0.3
  deterministic:
    s0: 0.0
    mu: 0.1
  perturbations:
    jumps:
      enabled: false
      intensity: 0.0
      size: 1.0
      seed: null

model:
  latent_size: 2
  context_size: 16
  hidden_size: 16
  encoder_type: stochastic
  decoder_type: deterministic
  diffusion_init: 0.3
  diffusion_min: 1.0e-3
  decoder_std_init: 0.05
  decoder_std_min: 1.0e-3

train:
  epochs: 20
  steps: 1000
  steps_per_epoch: 50
  batch_size: 64
  lr: 1.0e-3
  lr_gamma: 0.999
  weight_decay: 0.0
  kl_anneal_iters: 500
  noise_std: 0.05
  adjoint: false
  method: euler
  dt: 0.05
  sample_method: euler
  sample_dt: 0.05
  grad_clip_norm: 10.0
  log_every: 10
  eval_every: 0
  save_checkpoint: true

evaluation:
  enabled: true
  every_epoch: 5
  n_paths: 512
  num_quantiles: 1024
  align_initial: false
  coupled_brownian: false

plots:
  enabled: true
  n_paths: 24
  align_initial: false

hydra:
  run:
    dir: ${paths.log_root}/hydra/${run_name}
