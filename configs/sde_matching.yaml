run_name: sde_matching_abm
seed: 0
device: auto

paths:
  log_root: ${hydra:runtime.cwd}/logs

data:
  dataset_size: 16192
  t_size: 301
  dt: 0.1
  normalize: false
  shuffle: true
  drop_last: true
  num_workers: 0

simulator:
  name: abm
  abm:
    dim: 2
    s0: 0.0
    mu: 0.1
    sigma: 0.2
    rho: 0.5
    corr: null
  gbm:
    dim: 1
    s0: 1.0
    mu: 0.05
    sigma: 0.2
    rho: 0.0
    corr: null
  ou:
    s0: 1.0
    theta: 0.1
    mu: 0.02
    sigma: 0.4
  deterministic:
    s0: 0.0
    mu: 0.1
  perturbations:
    jumps:
      enabled: false
      intensity: 0.0
      size: 1.0
      seed: null

model:
  latent_size: 4
  hidden_size: 32
  observation_noise_std: 0.01

train:
  epochs: 100
  steps: 10000
  steps_per_epoch: 100
  batch_size: 1024
  lr: 1.0e-3
  weight_decay: 0.0
  grad_clip_norm: null
  sample_inner_steps: 1
  log_every: 10
  eval_every: 0
  save_checkpoint: true

evaluation:
  enabled: true
  every_epoch: 1
  n_paths: 512
  num_quantiles: 1024
  align_initial: true
  coupled_brownian: false

plots:
  enabled: true
  n_paths: 24
  align_initial: true

hydra:
  run:
    dir: ${paths.log_root}/hydra/${run_name}
