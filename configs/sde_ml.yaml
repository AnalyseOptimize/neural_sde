run_name: sde_ml_ou_functions
seed: 0
device: auto

paths:
  log_root: ${hydra:runtime.cwd}/logs

data:
  dataset_size: 4096
  t_size: 501
  dt: 0.02
  normalize: false
  shuffle: true
  drop_last: false
  num_workers: 0

simulator:
  name: ou
  abm:
    dim: 2
    s0: 0.0
    mu: 0.1
    sigma: 0.2
    rho: 0.5
    corr: null
  gbm:
    dim: 1
    s0: 1.0
    mu: 0.05
    sigma: 0.2
    rho: 0.5
    corr: null
  ou:
    s0: 2.0
    theta: 1.0
    mu: 0.0
    sigma: 0.3
  deterministic:
    s0: 0.0
    mu: 0.1
  perturbations:
    gaussian:
      enabled: false
      variance: 0.01
      include_initial: true
      seed: null
    jumps:
      enabled: false
      intensity: 0.01
      size: 1.0
      seed: null

model:
  noise_size: 1
  noise_type: diagonal
  sde_type: ito
  drift_head: simple
  diffusion_head: simple
  drift_window_size: 1
  diffusion_window_size: 1
  hidden_size: 16
  num_layers: 2
  drift_init: 0.0
  diffusion_init: 0.1
  drift_scale: 1.0
  diffusion_scale: 1.0
  final_tanh: false
  variance_floor: 1.0e-6
  diffusion_min: 1.0e-4
  initial_value: auto
  learn_initial: false
  time_origin: auto
  time_scale: auto
  state_center: 0.0
  state_scale: auto
  input_clip: 20.0
  method: euler
  dt: 0.02
  adjoint: false
  sampling_backend: torchsde

train:
  epochs: 30
  steps: 1500
  steps_per_epoch: 50
  batch_size: 128
  lr: 3.0e-3
  weight_decay: 0.0
  optimizer: adam
  adam_beta1: 0.9
  adam_beta2: 0.999
  grad_clip_norm: 20.0
  log_every: 100
  eval_every: 0
  likelihood_backend: direct
  sampling_backend: direct
  include_initial_likelihood: false
  initial_std: null
  save_checkpoint: true

evaluation:
  enabled: true
  every_epoch: 5
  n_paths: 512
  num_quantiles: 1024
  align_initial: true
  coupled_brownian: true
  brownian_seed: 1000003

plots:
  enabled: true
  n_paths: 24
  align_initial: true
  coupled_paths:
    enabled: true
    n_paths: 5
    brownian_seed: ${evaluation.brownian_seed}
    sampling_backend: ${train.sampling_backend}
  coefficient_calibration:
    enabled: true
    n_paths: 512
  simple_slices:
    enabled: true
    n_grid: 128
    n_levels: 40
    state_dimension: 0

hydra:
  run:
    dir: ${paths.log_root}/hydra/${run_name}
